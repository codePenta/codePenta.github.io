name: Update Projects

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      REPOSITORY_FETCH_TOKEN: ${{ secrets.PAT_TOKEN }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run fetch script
        run: node scripts/updateProjects.js

      - name: Commit and push generated files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add public/data/projects.json public/data/projects.i18n.json

          if ! git diff --cached --quiet; then
              git commit -m "Update projects data"
              git push
          else
              echo "No generated file changes to commit."
          fi
