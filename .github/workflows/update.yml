name: Update Projects JSON

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetchers/fetchRepos.js"
      - "scripts/generators/generateLanguageIcons.js"
      - "scripts/generators/generateVersionControlIcons.js"

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      REPOSITORY_FETCH_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run fetch script
        run: node scripts/fetchers/fetchRepos.js

      - name: Run language icon generation script
        run: node scripts/generators/generateLanguageIcons.js

      - name: Run version control icon generation script
        run: node scripts/generators/generateVersionControlIcons.js

      - name: Commit and push generated files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet -- public/data/projects.json public/assets/icons; then
            git add public/data/projects.json public/assets/icons
            git commit -m "fix(ci): stabilize repo refresh workflow with PAT and update guard"
            git push
          else
            echo "No generated file changes to commit."
          fi
